<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capital Ledger</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <h1>Capital Ledger</h1>
        <p class="tagline">Measure the decisions, not just the portfolio.</p>
      </header>

      <section aria-labelledby="summary-heading">
        <h2 id="summary-heading">Synthetic Portfolio Snapshot</h2>
        <p class="note">
          This Phase 1 interface is intentionally simple so the calculation engine stays easy to inspect and test.
        </p>
        <table>
          <thead>
            <tr>
              <th scope="col">Metric</th>
              <th scope="col">Value</th>
            </tr>
          </thead>
          <tbody id="summary-table-body"></tbody>
        </table>
      </section>

      <section aria-labelledby="assumptions-heading">
        <h2 id="assumptions-heading">Calculation Assumptions Used</h2>
        <ul id="assumptions-list"></ul>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
